name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare assets
        shell: bash
        run: |
          mkdir -p staging
          cp target/x86_64-pc-windows-gnu/release/battery_report_tray.exe staging/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/battery_report_tray.exe
          generate_release_notes: true
